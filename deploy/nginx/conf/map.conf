worker_processes  1;
error_log  logs/map-error.log warn;
pid        logs/map-nginx.pid;

events {
    worker_connections  512;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log    logs/map-access.log;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65;
    client_max_body_size 2m;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_vary         on;

    client_body_temp_path  temp/client_body;
    proxy_temp_path        temp/proxy;
    fastcgi_temp_path      temp/fastcgi;
    uwsgi_temp_path        temp/uwsgi;
    scgi_temp_path         temp/scgi;

    upstream map_app {
        server 127.0.0.1:8802;
        keepalive 16;
    }

    # HTTP：局域网直连（手机连同一 Wi-Fi 用）
    server {
        listen       8800;
        server_name  _;

        location / {
            proxy_pass http://map_app;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_read_timeout 60s;
        }
    }

    # HTTPS：公网入口（Sakura TCP 隧道 → 127.0.0.1:8801）
    server {
        listen       8801 ssl;
        http2        on;
        server_name  _;

        ssl_certificate      ../../tls/server.crt;
        ssl_certificate_key  ../../tls/server.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_session_cache    shared:MapTLS:10m;
        ssl_session_timeout  10m;
        ssl_buffer_size      4k;

        location / {
            proxy_pass http://map_app;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_read_timeout 60s;
        }
    }
}
