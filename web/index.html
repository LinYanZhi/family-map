<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0a1622">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>家庭地图</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230d2033'/%3E%3Cpath d='M16 7c3.3 0 6 2.7 6 6 0 4.5-6 12-6 12S10 17.5 10 13c0-3.3 2.7-6 6-6z' fill='%2335d07f'/%3E%3Ccircle cx='16' cy='13' r='2.2' fill='%230a1622'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://webapi.amap.com">
  <link rel="preconnect" href="https://webst.amap.com">
  <link rel="stylesheet" href="css/app.css?v=0.5.0">
</head>
<body>
  <div id="map" class="map" role="application" aria-label="地图"></div>

  <header class="topbar">
    <div class="brand">
      <span class="status-dot" id="status-dot" aria-hidden="true"></span>
      <h1>家庭地图</h1>
    </div>
    <span class="ver" id="ver">v0.5.0</span>
  </header>

  <button id="locate" class="fab locate" type="button" aria-label="定位到当前位置">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <circle cx="12" cy="12" r="3.2" fill="currentColor"></circle>
      <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
      <path d="M12 1.5v3.2M12 19.3v3.2M1.5 12h3.2M19.3 12h3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
    </svg>
  </button>

  <section id="sheet" class="sheet" hidden aria-label="功能面板">
    <div class="sheet-head">
      <button id="sheet-grip" class="sheet-grip" type="button" aria-label="收起面板"></button>
      <h2 id="sheet-title">搜索</h2>
      <button id="sheet-close" class="icon-btn" type="button" aria-label="关闭">✕</button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </section>

  <nav class="tabbar" aria-label="主要功能">
    <button class="tab" type="button" data-sheet="search">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"></circle><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
      <span>搜索</span>
    </button>
    <button class="tab" type="button" data-sheet="route">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 19V8a3 3 0 013-3h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path><circle cx="6" cy="20" r="2.2" fill="currentColor"></circle><path d="M15 2l4 3-4 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span>路线</span>
    </button>
    <button class="tab" type="button" data-sheet="style">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3a9 9 0 100 18h1.5a2.5 2.5 0 002.5-2.5c0-1.4-1.1-2.5-2.5-2.5H13a2 2 0 01-2-2V13a9 9 0 00-9-9z" fill="none" stroke="currentColor" stroke-width="1.6"></path><circle cx="8.5" cy="9" r="1.1" fill="currentColor"></circle><circle cx="12" cy="7" r="1.1" fill="currentColor"></circle><circle cx="15.5" cy="9" r="1.1" fill="currentColor"></circle></svg>
      <span>样式</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>

  <div id="pickbar" class="pickbar" hidden>
    <span>点地图选择位置</span>
    <button id="pick-cancel" type="button">取消</button>
  </div>

  <div id="nav" class="nav" hidden>
    <div class="nav-head">
      <span class="nav-badge">导航中</span>
      <div class="nav-instruction" id="nav-instruction">正在定位…</div>
      <div class="nav-next" id="nav-next"></div>
    </div>
    <div class="nav-foot">
      <div class="nav-stats">
        <span id="nav-remaining-distance">--</span>
        <span class="nav-sep">·</span>
        <span id="nav-remaining-time">--</span>
        <span class="nav-step" id="nav-step"></span>
      </div>
      <div class="nav-actions">
        <button id="nav-voice" class="nav-btn" type="button">语音 开</button>
        <button id="nav-exit" class="nav-btn nav-exit" type="button">退出导航</button>
      </div>
    </div>
    <div class="nav-progress"><div id="nav-progress-bar"></div></div>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay-card">
      <h2 id="overlay-title">地图加载失败</h2>
      <p id="overlay-text"></p>
      <button id="overlay-retry" type="button">重试</button>
      <p id="diag" class="diag"></p>
    </div>
  </div>

  <script type="module" src="js/app.js?v=0.5.0"></script>
</body>
</html>
